{% extends "base.html" %}
{% block title %}Log in - Student Expense Tracker{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to see your expenses.</p>
  <form id="auth-form" data-mode="login" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="message" class="msg" role="alert" aria-live="polite"></p>
    <button class="btn" type="submit" id="submit">Log in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='auth.js') }}"></script>{% endblock %}
